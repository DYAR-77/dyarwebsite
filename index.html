<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مودات ديار | DYAR MODS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120000;--accent:#ff2d2d;--accent2:#8b0000;--text:#fff;--ease:cubic-bezier(.45,0,.25,1);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--text);background-color:var(--bg);background-image:radial-gradient(ellipse at 50% 55%,#6b0505 0%,#2a0202 45%,#0c0000 85%);overflow-x:hidden}
.embers,.cubes{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#ff6a6a,rgba(255,45,45,0) 70%);opacity:0;animation:float 15s linear infinite;will-change:transform,opacity}
.cubes b{position:absolute;bottom:-60px;border:2px solid rgba(255,70,70,.4);background:rgba(255,45,45,.07);opacity:0;animation:drift 28s linear infinite;will-change:transform,opacity}
.embers i:nth-child(1){left:10%;animation-delay:0s;animation-duration:14s}
.embers i:nth-child(2){left:30%;animation-delay:5s;animation-duration:16s}
.embers i:nth-child(3){left:52%;animation-delay:9s;animation-duration:15s}
.embers i:nth-child(4){left:72%;animation-delay:3s;animation-duration:17s}
.embers i:nth-child(5){left:90%;animation-delay:7s;animation-duration:14s}
.cubes b:nth-child(1){left:12%;width:26px;height:26px;animation-delay:0s;animation-duration:26s}
.cubes b:nth-child(2){left:48%;width:30px;height:30px;animation-delay:10s;animation-duration:30s}
.cubes b:nth-child(3){left:84%;width:20px;height:20px;animation-delay:18s;animation-duration:28s}

main{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;text-align:center;max-width:460px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
.title-ar{font-size:2.6rem;font-weight:800;text-shadow:0 0 26px rgba(255,45,45,.85),0 2px 10px #000;animation:rise 1.8s var(--ease) .1s both}
.title-en{font-size:1.25rem;font-weight:600;letter-spacing:.4em;color:var(--accent);text-shadow:0 2px 10px #000;margin-top:4px;animation:rise 1.8s var(--ease) .5s both}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:14px 0}
.glow{position:absolute;left:50%;top:50%;width:min(80vw,380px);height:min(80vw,380px);margin:calc(min(80vw,380px)/-2) 0 0 calc(min(80vw,380px)/-2);border-radius:50%;background:radial-gradient(circle,rgba(255,45,45,.5),rgba(255,45,45,0) 65%);animation:breathe 7s ease-in-out infinite;will-change:opacity,transform}
.skin{position:relative;height:min(52svh,470px);max-height:100%;width:auto;max-width:80%;object-fit:contain;animation:appear 1.8s var(--ease) .5s both,bob 8s ease-in-out 2.4s infinite}
.btn{position:relative;overflow:hidden;display:block;text-decoration:none;color:var(--text);padding:18px 20px;border-radius:18px;font-weight:800;font-size:1.15rem;background:linear-gradient(135deg,var(--accent2),var(--accent));border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 28px rgba(255,45,45,.45);animation:rise 1.8s var(--ease) 1s both,pulse 5s ease-in-out 3s infinite;transition:transform .4s var(--ease)}
.btn:active{transform:scale(.97)}
.btn small{display:block;font-weight:600;font-size:.85rem;color:#ffd9d9;margin-top:2px}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-150%) skewX(-20deg);animation:shine 6s var(--ease) 5s infinite}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes appear{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes shine{0%,55%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(450%) skewX(-20deg)}}
@keyframes float{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}100%{transform:translate3d(-12px,-110vh,0);opacity:0}}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}15%{opacity:1}85%{opacity:.7}100%{transform:translate3d(0,-115vh,0) rotate(160deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
